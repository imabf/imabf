<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" role="img" aria-label="Ahmad Almashhadani, Software Engineer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset=".55" stop-color="#101a2e"/><stop offset="1" stop-color="#0d2a1f"/></linearGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#bc8cff"/><stop offset="1" stop-color="#39d353"/></linearGradient>
<clipPath id="c"><rect width="860" height="220" rx="14"/></clipPath>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.r{font-size:11px;fill:#39d353;opacity:0}
.nm{font-size:44px;font-weight:800;fill:url(#nm)}
.tag{font-size:19px;fill:#c9d1d9}
.sub{font-size:12px;fill:#7d8590;letter-spacing:3px}
@keyframes fall{from{transform:translateY(-10px);opacity:0}15%{opacity:.5}to{transform:translateY(240px);opacity:0}}.r{animation:fall linear infinite}@keyframes glow{0%,100%{opacity:.8}50%{opacity:1}}.nm{animation:glow 3s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.r,.nm{animation:none}}
</style>
<g clip-path="url(#c)">
<rect width="860" height="220" fill="url(#bg)"/>
<text class="r" x="20" y="0" style="animation-duration:5s;animation-delay:-0.0s">assert response.status_code == 200</text><text class="r" x="103" y="0" style="animation-duration:6s;animation-delay:-0.9s">Given / When / Then</text><text class="r" x="186" y="0" style="animation-duration:7s;animation-delay:-1.8s">SELECT COUNT(*) FROM orders;</text><text class="r" x="269" y="0" style="animation-duration:8s;animation-delay:-2.7s">boundary values: min, min+1, max</text><text class="r" x="352" y="0" style="animation-duration:5s;animation-delay:-3.6s">Steps to reproduce:</text><text class="r" x="435" y="0" style="animation-duration:6s;animation-delay:-4.5s">POST /api/login -&gt; 401</text><text class="r" x="518" y="0" style="animation-duration:7s;animation-delay:-5.4s">As a user, I want to...</text><text class="r" x="601" y="0" style="animation-duration:8s;animation-delay:-6.3s">Expected vs actual result</text><text class="r" x="684" y="0" style="animation-duration:5s;animation-delay:-7.2s">Acceptance criteria met</text><text class="r" x="767" y="0" style="animation-duration:6s;animation-delay:-8.1s">Test case: PASS</text>
<rect width="860" height="220" fill="#0d1117" opacity=".35"/>
</g>
<rect x=".5" y=".5" width="859" height="219" rx="14" fill="none" stroke="#30363d"/>
<text x="430" y="82" class="nm" text-anchor="middle">Ahmad Almashhadani</text>
<text x="430" y="108" class="sub" text-anchor="middle">SOFTWARE QA · BUSINESS ANALYSIS · DOHA, QATAR</text>
<text x="430" y="150" class="tag" text-anchor="middle" opacity="0">&gt; Software QA testing and business analysis<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.000;0.030;0.210;0.240;1" dur="16s" repeatCount="indefinite"/></text><text x="430" y="150" class="tag" text-anchor="middle" opacity="0">&gt; Test cases, bug reports, API testing with Postman<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.280;0.460;0.490;1" dur="16s" repeatCount="indefinite"/></text><text x="430" y="150" class="tag" text-anchor="middle" opacity="0">&gt; Requirements, user stories, acceptance criteria<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.530;0.710;0.740;1" dur="16s" repeatCount="indefinite"/></text><text x="430" y="150" class="tag" text-anchor="middle" opacity="0">&gt; Business Analyst Intern at Applab<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.780;0.960;0.990;1" dur="16s" repeatCount="indefinite"/></text>
</svg>
